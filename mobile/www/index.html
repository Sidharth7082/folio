<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <title>Folio</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!--
      The app opens straight into the library. There is nothing to configure and
      nothing to connect to: the books are on the device and so is the reader.
    -->

    <header class="bar" id="library-bar">
      <h1>Folio</h1>
      <button id="import" class="icon-button" type="button" aria-label="Import a book">
        <span aria-hidden="true">+</span>
      </button>
    </header>

    <main>
      <section id="library" aria-label="Your library">
        <p class="empty" id="empty" hidden>
          <span class="empty-face">(⌐■_■)</span>
          No books yet.<br />
          Tap <strong>+</strong> to import an EPUB from your phone.
        </p>
        <ul class="shelf" id="shelf"></ul>
      </section>

      <section id="reader" hidden aria-label="Reader">
        <header class="bar reader-bar">
          <button id="close-reader" class="icon-button" type="button" aria-label="Back to library">
            <span aria-hidden="true">‹</span>
          </button>
          <div class="reader-titles">
            <p id="reader-book" class="reader-book"></p>
            <p id="reader-chapter" class="reader-chapter"></p>
          </div>
        </header>

        <article id="chapter" class="chapter"></article>

        <nav class="chapter-nav">
          <button id="prev" type="button">Previous</button>
          <span id="position" class="position"></span>
          <button id="next" type="button">Next</button>
        </nav>
      </section>
    </main>

    <!-- A plain file input, which the WebView turns into the system picker.
         No plugin, and the user picks from wherever their books actually are. -->
    <input id="file" type="file" accept=".epub,application/epub+zip,.txt,text/plain" hidden />

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <script type="module" src="app.js"></script>
  </body>
</html>
