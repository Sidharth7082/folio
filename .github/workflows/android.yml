name: Android

# Builds the phone app.
#
# This is the supported way to produce the APK: a local build needs a full
# Android SDK and a JDK, and neither is a reasonable thing to ask of someone who
# just wants the app. Run it from the Actions tab, or push a `v*` tag and the
# APKs are attached to that release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      build:
        description: Which APK to build
        type: choice
        options: [debug, release, both]
        default: release

permissions:
  contents: write

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # AGP 8.13 requires 17 or newer; 21 is what it is developed against.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # The runner image already carries an Android SDK with ANDROID_HOME set,
      # and this project compiles against SDK 36, which the image does not
      # include yet. Installing just that by hand is more reliable than
      # android-actions/setup-android, which pins a cmdline-tools version and
      # fails its own licence step when the image's SDK is newer.
      - name: Install Android SDK packages
        run: |
          sdkmanager="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          # Piping `yes` closes the pipe early once the licences are read, which
          # the shell reports as a failure; the exit code is not meaningful here.
          yes | "$sdkmanager" --licenses > /dev/null 2>&1 || true
          "$sdkmanager" --install "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      # Copies www/ into the Android assets and refreshes the plugin list, so the
      # shell in the APK matches the sources it was built from.
      - name: Sync web assets and plugins
        run: npx cap sync android

      - name: Build APKs
        run: |
          cd android
          chmod +x gradlew
          case "${{ inputs.build || 'release' }}" in
            debug)   ./gradlew assembleDebug --no-daemon ;;
            release) ./gradlew assembleRelease --no-daemon ;;
            *)       ./gradlew assembleDebug assembleRelease --no-daemon ;;
          esac
        env:
          # Absent unless the repository defines these. Without them the release
          # build is signed with the debug key, which still installs.
          FOLIO_KEYSTORE_PATH: ${{ secrets.FOLIO_KEYSTORE_PATH }}
          FOLIO_KEYSTORE_PASSWORD: ${{ secrets.FOLIO_KEYSTORE_PASSWORD }}
          FOLIO_KEY_ALIAS: ${{ secrets.FOLIO_KEY_ALIAS }}
          FOLIO_KEY_PASSWORD: ${{ secrets.FOLIO_KEY_PASSWORD }}

      - name: Collect APKs
        run: |
          mkdir -p ../apk
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} ../apk/ \;
          ls -lh ../apk/

      - uses: actions/upload-artifact@v4
        with:
          name: folio-apk
          path: apk/*.apk
          if-no-files-found: error

      # On a tag, the APKs become release assets so the app can be downloaded
      # without signing in to GitHub. Pushing a tag is the whole release process:
      # create it if it does not exist yet, then attach.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: .
        run: |
          gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" \
                 --title "Folio ${GITHUB_REF_NAME}" \
                 --generate-notes
          gh release upload "${GITHUB_REF_NAME}" apk/*.apk --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
